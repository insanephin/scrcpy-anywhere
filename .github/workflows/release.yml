name: Release connector

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact_name: scrcpy-anywhere-windows
          - os: ubuntu-latest
            name: Linux
            artifact_name: scrcpy-anywhere-linux
          - os: macos-latest
            name: macOS
            artifact_name: scrcpy-anywhere-macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller pillow certifi

      - name: Check source syntax
        run: python -m py_compile connector.py launcher.py build.py

      - name: Build application
        run: python build.py --version ${{ github.event_name == 'push' && github.ref_name || '0.0.0' }}

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false

      - name: Write checksums
        run: |
          mkdir release-files
          cp release-assets/*/* release-files/
          cd release-files
          sha256sum * > ../SHA256SUMS
          mv ../SHA256SUMS .

      - name: Create release or replace its assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" --repo "$REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-files/* --clobber --repo "$REPOSITORY"
          else
            gh release create "$TAG_NAME" release-files/* --title "$TAG_NAME" --generate-notes --repo "$REPOSITORY"
          fi