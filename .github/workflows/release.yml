name: Release connector

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact_name: scrcpy-anywhere-windows
          - os: ubuntu-latest
            name: Linux
            artifact_name: scrcpy-anywhere-linux
          - os: macos-latest
            name: macOS
            artifact_name: scrcpy-anywhere-macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Check source syntax
        run: python -m py_compile connector.py

      - name: Build one-file application
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name scrcpy-anywhere connector.py

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/scrcpy-anywhere*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: >
          gh release create "$TAG_NAME" release-assets/*/*
          --title "$TAG_NAME" --generate-notes
