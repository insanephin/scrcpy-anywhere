name: Release connector

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact_name: scrcpy-anywhere-windows
            asset_path: dist/scrcpy-anywhere.exe
          - os: ubuntu-latest
            name: Linux
            artifact_name: scrcpy-anywhere-linux
            asset_path: dist/scrcpy-anywhere
          - os: macos-latest
            name: macOS
            artifact_name: scrcpy-anywhere-macos
            asset_path: dist/scrcpy-anywhere-macos.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Check source syntax
        run: python -m py_compile connector.py

      - name: Build one-file application
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --icon scrcpy-anywhere.ico
          --add-data scrcpy-anywhere.ico:.
          --name scrcpy-anywhere connector.py

      - name: Package macOS application bundle
        if: matrix.os == 'macos-latest'
        run: >
          ditto -c -k --sequesterRsrc --keepParent
          dist/scrcpy-anywhere.app dist/scrcpy-anywhere-macos.zip

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false

      - name: Create release or replace its assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" --repo "$REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/*/* --clobber --repo "$REPOSITORY"
          else
            gh release create "$TAG_NAME" release-assets/*/* --title "$TAG_NAME" --generate-notes --repo "$REPOSITORY"
          fi