name: Build connector

on:
  push:
    branches: [main]
    paths:
      - "connector.py"
      - "launcher.py"
      - "build.py"
      - "scrcpy-anywhere.ico"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "connector.py"
      - "launcher.py"
      - "build.py"
      - "scrcpy-anywhere.ico"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact_name: scrcpy-anywhere-windows
          - os: ubuntu-latest
            name: Linux
            artifact_name: scrcpy-anywhere-linux
          - os: macos-latest
            name: macOS
            artifact_name: scrcpy-anywhere-macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller pillow certifi

      - name: Check source syntax
        run: python -m py_compile connector.py launcher.py build.py

      - name: Build application
        run: python build.py --version 0.0.0

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
