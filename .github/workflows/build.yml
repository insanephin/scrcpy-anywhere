name: Build connector

on:
  push:
    branches: [main]
    paths:
      - "connector.py"
      - "scrcpy-anywhere.ico"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "connector.py"
      - "scrcpy-anywhere.ico"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact_name: scrcpy-anywhere-windows
            asset_path: dist/scrcpy-anywhere.exe
            bundle_mode: --onefile
          - os: ubuntu-latest
            name: Linux
            artifact_name: scrcpy-anywhere-linux
            asset_path: dist/scrcpy-anywhere
            bundle_mode: --onefile
          - os: macos-latest
            name: macOS
            artifact_name: scrcpy-anywhere-macos
            asset_path: dist/scrcpy-anywhere-macos.dmg
            bundle_mode: --onedir

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller pillow certifi

      - name: Check source syntax
        run: python -m py_compile connector.py

      - name: Build application
        run: >
          pyinstaller --noconfirm --clean ${{ matrix.bundle_mode }} --windowed
          --icon scrcpy-anywhere.ico
          --add-data scrcpy-anywhere.ico:.
          --name scrcpy-anywhere connector.py

      - name: Package macOS application bundle
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist/dmg-root
          cp -R dist/scrcpy-anywhere.app dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname scrcpy-anywhere -srcfolder dist/dmg-root \
            -ov -format UDZO dist/scrcpy-anywhere-macos.dmg

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}
          if-no-files-found: error
          retention-days: 14
