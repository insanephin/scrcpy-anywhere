x-redroid: &redroid
  build:
    context: redroid
  image: scrcpy-anywhere-redroid:12.0.0-mtg-ndk
  privileged: true
  command:
    - androidboot.redroid_gpu_mode=${REDROID_GPU_MODE:-guest}
    - androidboot.redroid_width=${REDROID_WIDTH:-720}
    - androidboot.redroid_height=${REDROID_HEIGHT:-1280}
    - androidboot.redroid_dpi=${REDROID_DPI:-320}
    - androidboot.redroid_fps=${REDROID_FPS:-30}
    - androidboot.use_memfd=1
    - androidboot.scrcpy_ccodec=${REDROID_CCODEC:-1}
  expose:
    - "5555"
  healthcheck:
    test: ["CMD-SHELL", "[ \"$$(getprop sys.boot_completed)\" = 1 ]"]
    interval: 15s
    timeout: 10s
    start_period: 180s
    retries: 3
  cpus: 2
  stop_grace_period: 30s
  restart: unless-stopped

x-relay: &relay
  build:
    context: .
    dockerfile: relay/Dockerfile
  image: scrcpy-anywhere-relay
  stop_grace_period: 10s
  restart: unless-stopped

services:
  redroid-1:
    <<: *redroid
    container_name: redroid-1
    volumes:
      - ./emulators/redroid-1/data:/data

  relay-1:
    <<: *relay
    container_name: relay-1
    environment:
      ADB_DEVICE: redroid-1:5555
    volumes:
      - ./emulators/redroid-1/adb:/root/.android
    ports:
      - "127.0.0.1:${RELAY_1_PORT:-5555}:5555"
    depends_on:
      - redroid-1

  redroid-2:
    <<: *redroid
    container_name: redroid-2
    volumes:
      - ./emulators/redroid-2/data:/data

  relay-2:
    <<: *relay
    container_name: relay-2
    environment:
      ADB_DEVICE: redroid-2:5555
    volumes:
      - ./emulators/redroid-2/adb:/root/.android
    ports:
      - "127.0.0.1:${RELAY_2_PORT:-5556}:5555"
    depends_on:
      - redroid-2
